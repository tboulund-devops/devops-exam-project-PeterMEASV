name: Code Coverage & Mutation Testing

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore server/api/api.csproj

      - name: Install Required tools
        run: |
          dotnet tool install -g dotnet-sonarscanner
          dotnet tool install -g dotnet-reportgenerator-globaltool
          dotnet tool install -g dotnet-stryker

      - name: SonarQube begin analysis
        run: |
          dotnet sonarscanner begin \
            /k:"VICJEN-Filmjournal" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.coverageReportPaths="coverage-report/SonarQube.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300

      - name: Build
        run: dotnet build server/api/api.csproj

      - name: Run tests with code coverage
        run: dotnet test server/Tests/Tests.csproj --collect:"XPlat Code Coverage" --results-directory server/TestResults

      - name: Generate report
        run: reportgenerator -reports:"server/TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:SonarQube
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Run Stryker
        run: cd server && dotnet stryker --break-at 80

      - name: SonarQube end analysis (quality gate)
        run: |
          dotnet sonarscanner end \
            /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
          
      - name: Application Version
        id: semver-app
        uses: paulhatch/semantic-version@v5.4.0
        with:
          bump_each_commit: true
          
      
      - name: Display Version
        run: echo "Generated version is ${{ steps.semver-app.outputs.version }}"
      
      
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
          
      - name: Build and push Docker image
        run: | 
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build \
          -t ghcr.io/${REPO_LOWER}:staging \
          -t ghcr.io/${REPO_LOWER}:${{ steps.semver-app.outputs.version }} \
          -f server/Dockerfile \
          server
          docker push ghcr.io/${REPO_LOWER} --all-tags
          
      - name: Create Release Notes
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_ENV
        
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.semver-app.outputs.version }}
          generateReleaseNotes: true
          allowUpdates: true
          body: |
            This release includes the following container image:
            http://ghcr.io/${{ env.REPO_LOWER }}:${{ steps.semver-app.outputs.version }}
            
      - name: Run k6 load test on staging
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y
          k6 run k6/Load_test.js 2>&1 | tee k6-results-${{ github.run_number }}-$(date +%Y%m%d_%H%M%S).txt

      - name: Upload k6 results to staging server
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          source: "k6-results-*.txt"
          target: "~/k6-logs/"

      - name: Deliver Docker Compose file to staging
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          source: "server/docker-compose.yaml"
          target: dowa/
          strip_components: 1
          
      - name: Run Docker Compose on staging server
        uses: appleboy/ssh-action@v1.2.1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          GOOGLE_BUCKET_NAME: ${{ secrets.GOOGLE_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ vars.STAGING_SERVER_IP }}
          username: ${{ vars.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GOOGLE_SERVICE_ACCOUNT_JSON,DB_CONNECTION_STRING,GOOGLE_BUCKET_NAME,JWT_SECRET
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > ~/dowa/google-key.json
            printf "DB_CONNECTION_STRING=%s\nGOOGLE_BUCKET_NAME=%s\nJWT_SECRET=%s\n" "$DB_CONNECTION_STRING" "$GOOGLE_BUCKET_NAME" "$JWT_SECRET" > ~/dowa/.env
            cd dowa
            docker compose pull
            docker compose up -d

  deployment:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deliver Docker Compose file to production
        uses: appleboy/scp-action@master
        with:
          host: ${{ vars.DEPLOYMENT_SERVER_IP }}
          username: ${{ vars.DEPLOYMENT_SERVER_USERNAME }}
          key: ${{ secrets.DEPLOYMENT_SERVER_SSH_KEY }}
          source: "server/docker-compose.yaml"
          target: dowa/
          strip_components: 1

      - name: Run Docker Compose on production server
        uses: appleboy/ssh-action@v1.2.1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          GOOGLE_BUCKET_NAME: ${{ secrets.GOOGLE_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ vars.DEPLOYMENT_SERVER_IP }}
          username: ${{ vars.DEPLOYMENT_SERVER_USERNAME }}
          key: ${{ secrets.DEPLOYMENT_SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,GOOGLE_SERVICE_ACCOUNT_JSON,DB_CONNECTION_STRING,GOOGLE_BUCKET_NAME,JWT_SECRET
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > ~/dowa/google-key.json
            printf "DB_CONNECTION_STRING=%s\nGOOGLE_BUCKET_NAME=%s\nJWT_SECRET=%s\n" "$DB_CONNECTION_STRING" "$GOOGLE_BUCKET_NAME" "$JWT_SECRET" > ~/dowa/.env
            cd dowa
            docker compose pull
            docker compose up -d
            
      - name: Deploy frontend to Fly.io
        