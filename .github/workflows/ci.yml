name: Code Coverage & Mutation Testing

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore server/api/api.csproj
      - name: Build
        run: dotnet build server/api/api.csproj      
      
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
        
      - name: Run tests with code coverage
        run: dotnet test server/Tests/Tests.csproj --collect:"XPlat Code Coverage" --results-directory server/TestResults
        
      - name: Generate report
        run: reportgenerator -reports:"server/TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:Html
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30
          
      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker
        
      - name: Run Stryker
        run: cd server && dotnet stryker --project api/api.csproj --break-at 80